<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="CampusPlan User Portal – View college timetables">
    <title>User Portal — CampusPlan</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --navy: #0d1f3c;
            --blue: #315ee8;
            --green: #10b981;
            --purple: #6c3ff5;
            --border: #e2e8f0;
            --muted: #64748b;
            --surface: #fff;
            --bg: #f1f4fb;
            font-family: 'Inter', system-ui, sans-serif;
        }
        html, body { min-height: 100vh; background: var(--bg); color: #1a2540; }
        body { display: flex; }

        /* ── Sidebar ─────────────────────────────────────────────── */
        .sidebar {
            position: fixed; z-index: 10; inset: 0 auto 0 0;
            width: 248px; padding: 22px 14px 16px;
            background: var(--navy);
            display: flex; flex-direction: column;
            overflow-y: auto;
            box-shadow: 4px 0 24px rgba(0,0,0,0.12);
        }
        .brand {
            display: flex; align-items: center; gap: 11px;
            padding: 0 8px 26px; text-decoration: none; color: #fff;
        }
        .brand-mark {
            display: grid; width: 42px; height: 42px; border-radius: 13px;
            place-items: center;
            background: linear-gradient(135deg, #315ee8, #6c3ff5);
            font-weight: 800; font-size: 15px; color: #fff;
            box-shadow: 0 4px 12px rgba(49,94,232,0.35);
        }
        .brand-text strong { display: block; font-size: 15px; font-weight: 700; letter-spacing: -0.02em; }
        .brand-text small  { display: block; font-size: 10.5px; color: #8fa8c8; margin-top: 2px; }

        .role-badge {
            display: flex; align-items: center; gap: 6px;
            margin: 0 8px 18px;
            padding: 8px 12px;
            border-radius: 8px;
            background: rgba(16,185,129,0.15);
            border: 1px solid rgba(16,185,129,0.25);
            color: #34d399;
            font-size: 11px; font-weight: 600;
        }
        .role-badge .dot { width: 7px; height: 7px; border-radius: 50%; background: #34d399; }

        .nav-section-label {
            padding: 0 10px; margin: 14px 0 6px;
            font-size: 10px; font-weight: 700; letter-spacing: 0.12em;
            color: #5d7a9b; text-transform: uppercase;
        }
        .nav-btn {
            display: flex; align-items: center; gap: 11px;
            width: 100%; min-height: 38px;
            padding: 8px 10px; border: 0; border-radius: 8px;
            color: #a8bdd6; background: transparent;
            font: inherit; font-size: 13px; text-align: left; cursor: pointer;
            transition: background 0.15s, color 0.15s;
        }
        .nav-btn .icon { width: 18px; text-align: center; font-size: 16px; color: #6b88a8; }
        .nav-btn:hover { background: rgba(255,255,255,0.07); color: #dce8f5; }
        .nav-btn.active { background: rgba(49,94,232,0.22); color: #fff; }
        .nav-btn.active .icon { color: #91b3ff; }

        .sidebar-footer {
            margin-top: auto; padding: 14px 10px 4px;
            border-top: 1px solid rgba(255,255,255,0.07);
        }
        .user-info {
            display: flex; align-items: center; gap: 9px; margin-bottom: 10px;
        }
        .user-avatar {
            width: 32px; height: 32px; border-radius: 50%;
            background: linear-gradient(135deg, #315ee8, #6c3ff5);
            display: grid; place-items: center;
            font-size: 13px; font-weight: 700; color: #fff;
        }
        .user-details strong { display: block; font-size: 12px; color: #cdd9ec; }
        .user-details small  { display: block; font-size: 10px; color: #6e8aaa; }
        .btn-logout {
            width: 100%; height: 34px; border: 1px solid rgba(255,255,255,0.10);
            border-radius: 8px; background: transparent;
            color: #8fa5c5; font: inherit; font-size: 12px; cursor: pointer;
            transition: background 0.15s, color 0.15s;
        }
        .btn-logout:hover { background: rgba(255,255,255,0.07); color: #e2eaf5; }

        /* ── Main area ───────────────────────────────────────────── */
        .main-area { margin-left: 248px; flex: 1; display: flex; flex-direction: column; min-height: 100vh; }

        .topbar {
            position: sticky; z-index: 5; top: 0;
            display: flex; align-items: center; justify-content: space-between;
            min-height: 64px; padding: 0 28px;
            background: rgba(255,255,255,0.96);
            border-bottom: 1px solid var(--border);
            backdrop-filter: blur(8px);
        }
        .topbar-left { display: flex; align-items: center; gap: 12px; }
        .menu-btn {
            display: none; width: 34px; height: 34px; border: 0;
            border-radius: 8px; background: #f1f4f8; color: #445570; cursor: pointer;
            font-size: 18px; align-items: center; justify-content: center;
        }
        .breadcrumb { font-size: 13px; color: #8491a5; display: flex; align-items: center; gap: 9px; }
        .breadcrumb b { color: #c3cad5; font-weight: 400; }
        .breadcrumb strong { color: #1a2540; font-weight: 650; }

        .topbar-right { display: flex; align-items: center; gap: 10px; }
        .portal-tag {
            display: flex; align-items: center; gap: 6px;
            padding: 5px 11px; border-radius: 20px;
            background: rgba(16,185,129,0.10); border: 1px solid rgba(16,185,129,0.2);
            color: #059669; font-size: 11px; font-weight: 600;
        }
        .portal-tag .dot { width: 6px; height: 6px; border-radius: 50%; background: #10b981; }

        /* ── Content ─────────────────────────────────────────────── */
        .content { flex: 1; padding: 28px 30px; max-width: 1400px; width: 100%; margin: 0 auto; }

        /* ── Notice ──────────────────────────────────────────────── */
        .notice {
            position: fixed; z-index: 20; top: 74px; right: 22px;
            max-width: min(460px, calc(100vw - 34px));
            padding: 12px 16px;
            border-radius: 10px; font-size: 13px;
            border: 1px solid #c5e8d3; color: #176b42; background: #f1fbf5;
            box-shadow: 0 8px 24px rgba(16,24,40,0.12);
            animation: slideIn 0.2s ease;
        }
        .notice.error { border-color: #f1cbc7; color: #a4261d; background: #fff7f6; }
        .notice.hidden { display: none !important; }
        @keyframes slideIn { from { opacity:0; transform: translateX(16px); } to { opacity:1; transform:none; } }

        /* ── Page heading ────────────────────────────────────────── */
        .page-heading { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; margin-bottom: 22px; }
        .page-heading-text h1 { font-size: clamp(20px, 3vw, 26px); font-weight: 800; letter-spacing: -0.04em; color: #1a2540; }
        .page-heading-text p { margin-top: 5px; font-size: 13px; color: var(--muted); line-height: 1.55; }
        .page-heading-actions { display: flex; gap: 8px; flex-shrink: 0; }

        /* ── Panels ──────────────────────────────────────────────── */
        .panel {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: 14px; padding: 22px;
            box-shadow: 0 2px 6px rgba(16,24,40,0.03);
            margin-top: 18px;
        }
        .panel:first-child { margin-top: 0; }
        .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
        .panel-head h2 { font-size: 15px; font-weight: 700; color: #1a2540; }
        .panel-head p  { font-size: 12px; color: var(--muted); margin-top: 4px; }

        /* ── Stat cards ──────────────────────────────────────────── */
        .stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 4px; }
        .stat-card {
            background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
            padding: 18px; display: flex; align-items: center; justify-content: space-between;
            box-shadow: 0 2px 6px rgba(16,24,40,0.03);
            transition: box-shadow 0.18s, transform 0.15s;
        }
        .stat-card:hover { box-shadow: 0 6px 20px rgba(49,94,232,0.10); transform: translateY(-2px); }
        .stat-card-label { font-size: 11.5px; color: #7a8fa8; margin-bottom: 7px; font-weight: 500; }
        .stat-card-value { font-size: 28px; font-weight: 800; letter-spacing: -0.05em; color: #1a2540; }
        .stat-card-icon {
            width: 44px; height: 44px; border-radius: 12px;
            display: grid; place-items: center; font-size: 20px;
        }
        .icon-blue   { background: #eef2ff; color: #315ee8; }
        .icon-green  { background: #ecfdf5; color: #10b981; }
        .icon-purple { background: #f3f0ff; color: #6c3ff5; }
        .icon-amber  { background: #fffbeb; color: #d97706; }

        /* ── Toolbar ─────────────────────────────────────────────── */
        .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 14px; }
        .toolbar-group { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; flex: 1; }
        .search-input, .filter-select {
            height: 38px; padding: 0 12px; border: 1.5px solid var(--border); border-radius: 9px;
            font: inherit; font-size: 12.5px; color: #1a2540; background: #fff; outline: none;
            transition: border-color 0.18s, box-shadow 0.18s;
        }
        .search-input { width: min(280px, 100%); }
        .filter-select { min-width: 160px; }
        .search-input:focus, .filter-select:focus {
            border-color: var(--blue);
            box-shadow: 0 0 0 3px rgba(49,94,232,0.10);
        }

        /* ── Buttons ─────────────────────────────────────────────── */
        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 6px;
            min-height: 36px; padding: 0 14px; border-radius: 9px;
            font: inherit; font-size: 12px; font-weight: 650; cursor: pointer;
            text-decoration: none; transition: 0.15s;
        }
        .btn-primary   { background: var(--blue); color: #fff; border: none; }
        .btn-primary:hover { background: #1e46c9; }
        .btn-secondary { background: #fff; color: #334155; border: 1.5px solid #d0d8e4; }
        .btn-secondary:hover { background: #f8fafc; }
        .btn-sm { min-height: 30px; padding: 0 10px; font-size: 11px; border-radius: 7px; }

        /* ── Table ───────────────────────────────────────────────── */
        .table-wrap { overflow-x: auto; border-radius: 10px; border: 1px solid var(--border); }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        thead th {
            padding: 11px 14px; font-size: 10.5px; font-weight: 700; letter-spacing: 0.07em;
            text-transform: uppercase; color: #7a8fa8; background: #f8fafc;
            border-bottom: 1px solid var(--border); white-space: nowrap;
        }
        tbody td { padding: 11px 14px; font-size: 12.5px; color: #2d3f56; border-bottom: 1px solid #edf2f7; }
        tbody tr:last-child td { border-bottom: 0; }
        tbody tr { transition: background 0.12s; }
        tbody tr:hover { background: #f8fafc; }

        /* ── Period card in weekly grid ──────────────────────────── */
        .period-card {
            padding: 8px 10px; border-left: 3px solid var(--blue);
            border-radius: 5px; background: #eef2ff;
        }
        .period-card strong { display: block; font-size: 11px; color: #1e3a8a; margin-bottom: 2px; }
        .period-card span { display: block; font-size: 10px; color: #4b6cb7; }
        .period-card small { display: block; font-size: 10px; color: #6b87ab; margin-top: 2px; }
        .weekly-grid td { min-width: 120px; height: 76px; white-space: normal; vertical-align: top; }

        /* ── Conflict badge ──────────────────────────────────────── */
        .badge-error { display: inline-block; padding: 3px 8px; border-radius: 5px; font-size: 10.5px; font-weight: 600; background: #fff2f0; color: #c0321f; }
        .badge-ok    { display: inline-block; padding: 3px 8px; border-radius: 5px; font-size: 10.5px; font-weight: 600; background: #ecfdf5; color: #065f46; }

        /* ── Empty / loading states ──────────────────────────────── */
        .empty-state { padding: 40px 20px; text-align: center; color: #8fa5c5; font-size: 13px; line-height: 1.7; }

        /* ── Footer ──────────────────────────────────────────────── */
        .app-footer { padding: 14px 30px; font-size: 10px; color: #9aafc4; border-top: 1px solid var(--border); }

        /* ── Responsive ──────────────────────────────────────────── */
        @media (max-width: 900px) {
            .stats-row { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 760px) {
            .sidebar { transform: translateX(-100%); transition: transform 0.22s ease; }
            .sidebar.open { transform: none; }
            .main-area { margin-left: 0; }
            .menu-btn { display: flex; }
            .topbar { padding: 0 14px; }
            .content { padding: 18px 14px; }
        }
        @media (max-width: 500px) {
            .stats-row { grid-template-columns: 1fr 1fr; gap: 9px; }
        }

        @media print {
            .sidebar, .topbar, .toolbar, .app-footer, .page-heading-actions, #notice { display: none !important; }
            .main-area { margin: 0; }
            .content { padding: 0; }
        }
    </style>
</head>
<body>

<!-- ─────────────────────── SIDEBAR ─────────────────────── -->
<aside class="sidebar" id="sidebar">
    <a class="brand" href="/login.html" aria-label="CampusPlan home">
        <div class="brand-mark">AT</div>
        <div class="brand-text">
            <strong>CampusPlan</strong>
            <small>User Portal</small>
        </div>
    </a>

    <div class="role-badge">
        <div class="dot"></div>
        <span id="role-label">Staff / User</span>
    </div>

    <p class="nav-section-label">Timetable</p>
    <button class="nav-btn active" data-page="timetable" id="nav-timetable">
        <span class="icon">📅</span> View Timetable
    </button>

    <p class="nav-section-label">Reports</p>
    <button class="nav-btn" data-page="conflicts" id="nav-conflicts">
        <span class="icon">⚑</span> Conflict Report
    </button>

    <p class="nav-section-label">Overview</p>
    <button class="nav-btn" data-page="dashboard" id="nav-dashboard">
        <span class="icon">▦</span> Dashboard
    </button>

    <div class="sidebar-footer">
        <div class="user-info">
            <div class="user-avatar" id="user-avatar">U</div>
            <div class="user-details">
                <strong id="user-name-display">User</strong>
                <small>Read-only access</small>
            </div>
        </div>
        <button class="btn-logout" id="btn-logout">⇠ Sign Out</button>
    </div>
</aside>

<!-- ─────────────────────── MAIN ─────────────────────────── -->
<div class="main-area">
    <header class="topbar">
        <div class="topbar-left">
            <button class="menu-btn" id="menu-btn" aria-label="Open menu">☰</button>
            <div class="breadcrumb">
                <span>CampusPlan</span>
                <b>/</b>
                <strong id="breadcrumb-title">View Timetable</strong>
            </div>
        </div>
        <div class="topbar-right">
            <div class="portal-tag"><div class="dot"></div> User Portal</div>
        </div>
    </header>

    <div id="notice" class="notice hidden" role="status"></div>

    <main class="content" id="view" aria-live="polite"></main>

    <footer class="app-footer">CampusPlan · User Portal — Read-only timetable access</footer>
</div>

<script>
// ── Auth guard ──────────────────────────────────────────────────────────────
(function () {
    const role = sessionStorage.getItem('cp_role');
    if (!role) { window.location.replace('/login.html'); return; }
    if (role === 'admin') { window.location.replace('/index.html'); return; }

    const name = sessionStorage.getItem('cp_name') || 'User';
    document.getElementById('user-name-display').textContent = name;
    document.getElementById('user-avatar').textContent = name.charAt(0).toUpperCase();
    document.getElementById('role-label').textContent = name;
})();

// ── Logout ──────────────────────────────────────────────────────────────────
document.getElementById('btn-logout').addEventListener('click', async () => {
    await fetch('/api/auth/logout', { method: 'POST' }).catch(() => {});
    sessionStorage.clear();
    window.location.href = '/login.html';
});

// ── UI helpers ──────────────────────────────────────────────────────────────
const view        = document.getElementById('view');
const noticeEl    = document.getElementById('notice');
let noticeTimer;

function showNotice(msg, isError = false) {
    noticeEl.textContent = msg;
    noticeEl.className = `notice${isError ? ' error' : ''}`;
    clearTimeout(noticeTimer);
    noticeTimer = setTimeout(() => noticeEl.classList.add('hidden'), 5000);
}

function escapeHtml(v) {
    return String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
}

function capitalize(s) { return s ? s.charAt(0) + s.slice(1).toLowerCase() : ''; }

async function api(path, opts = {}) {
    const headers = { ...(opts.headers || {}) };
    if (opts.body) headers['Content-Type'] = 'application/json';
    let res;
    try {
        res = await fetch(`/api/${path}`, { ...opts, headers });
    } catch {
        throw new Error('Server unreachable. Make sure CampusPlan is running.');
    }
    if (res.status === 401) { sessionStorage.clear(); window.location.href = '/login.html'; return; }
    const data = res.status === 204 ? null : await res.json().catch(() => null);
    if (!res.ok) throw new Error(data?.message || `Request failed (${res.status}).`);
    return data;
}

// ── Navigation ───────────────────────────────────────────────────────────────
let currentPage = '';
const pages = { timetable: 'View Timetable', conflicts: 'Conflict Report', dashboard: 'Dashboard' };

function setActiveNav(page) {
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.page === page));
    document.getElementById('breadcrumb-title').textContent = pages[page] || page;
    document.getElementById('sidebar').classList.remove('open');
}

async function navigate(page) {
    if (currentPage === page) return;
    currentPage = page;
    window.history.pushState(null, '', `#${page}`);
    setActiveNav(page);
    view.innerHTML = `<div class="empty-state">Loading…</div>`;
    try {
        if (page === 'timetable') await renderTimetable();
        else if (page === 'conflicts') await renderConflicts();
        else if (page === 'dashboard') await renderDashboard();
    } catch (err) {
        view.innerHTML = `<div class="panel"><div class="empty-state">⚠ ${escapeHtml(err.message)}</div></div>`;
    }
}

document.querySelectorAll('.nav-btn[data-page]').forEach(b => {
    b.addEventListener('click', () => navigate(b.dataset.page));
});
document.getElementById('menu-btn').addEventListener('click', () => {
    document.getElementById('sidebar').classList.toggle('open');
});
window.addEventListener('popstate', () => {
    const p = window.location.hash.slice(1) || 'timetable';
    navigate(pages[p] ? p : 'timetable');
});

// ── Dashboard ────────────────────────────────────────────────────────────────
async function renderDashboard() {
    const [dash, tt] = await Promise.all([api('dashboard'), api('timetable').catch(() => [])]);
    const entries = Array.isArray(tt) ? tt : [];
    const cards = [
        { label: 'Departments', val: dash.departments, icon: '◫', cls: 'icon-blue' },
        { label: 'Courses',     val: dash.courses,     icon: '▤', cls: 'icon-purple' },
        { label: 'Teachers',    val: dash.teachers,    icon: '♙', cls: 'icon-green' },
        { label: 'Classes',     val: dash.classes,     icon: '▣', cls: 'icon-amber' },
        { label: 'Subjects',    val: dash.subjects,    icon: '▧', cls: 'icon-blue' },
        { label: 'Classrooms',  val: dash.classrooms,  icon: '⌂', cls: 'icon-purple' },
        { label: 'Periods',     val: dash.periods,     icon: '◷', cls: 'icon-green' },
        { label: 'Conflicts',   val: dash.conflicts,   icon: '⚑', cls: 'icon-amber' },
    ];

    view.innerHTML = `
    <div class="page-heading">
        <div class="page-heading-text">
            <h1>Dashboard</h1>
            <p>A read-only overview of the current timetable workspace.</p>
        </div>
    </div>
    <div class="stats-row">
        ${cards.map(c => `
        <div class="stat-card">
            <div>
                <div class="stat-card-label">${escapeHtml(c.label)}</div>
                <div class="stat-card-value">${escapeHtml(c.val ?? 0)}</div>
            </div>
            <div class="stat-card-icon ${c.cls}">${c.icon}</div>
        </div>`).join('')}
    </div>
    <div class="panel">
        <div class="panel-head"><div><h2>Recent Timetable Entries</h2><p>Latest ${Math.min(entries.length, 8)} of ${entries.length} scheduled periods.</p></div>
            <button class="btn btn-secondary btn-sm" id="go-tt-btn">View all →</button>
        </div>
        ${entries.length ? `<div class="table-wrap"><table>
            <thead><tr><th>Day</th><th>Period</th><th>Class</th><th>Subject</th><th>Teacher</th><th>Room</th></tr></thead>
            <tbody>${entries.slice(0, 8).map(e => `<tr>
                <td>${escapeHtml(capitalize(e.dayOfWeek))}</td>
                <td>${escapeHtml(e.startTime)}–${escapeHtml(e.endTime)}</td>
                <td>${escapeHtml(e.className)}</td>
                <td>${escapeHtml(e.subjectName)}</td>
                <td>${escapeHtml(e.teacherName)}</td>
                <td>${escapeHtml(e.classroomName)}</td>
            </tr>`).join('')}</tbody>
        </table></div>` : `<div class="empty-state">No timetable entries yet.</div>`}
    </div>`;
    document.getElementById('go-tt-btn').addEventListener('click', () => navigate('timetable'));
}

// ── Timetable ────────────────────────────────────────────────────────────────
async function renderTimetable() {
    const [entries, classes, teachers] = await Promise.all([
        api('timetable'), api('classes'), api('teachers')
    ]);

    const days = ['MONDAY', 'TUESDAY', 'WEDNESDAY', 'THURSDAY', 'FRIDAY'];
    let filtered = Array.isArray(entries) ? [...entries] : [];
    let viewMode = 'list';

    function applyFilters() {
        const classId   = document.getElementById('filter-class')?.value;
        const teacherId = document.getElementById('filter-teacher')?.value;
        const search    = (document.getElementById('tt-search')?.value || '').toLowerCase();
        filtered = entries.filter(e => {
            if (classId   && String(e.classId)   !== classId)   return false;
            if (teacherId && String(e.teacherId) !== teacherId) return false;
            if (search && !JSON.stringify(e).toLowerCase().includes(search)) return false;
            return true;
        });
        document.getElementById('tt-count').textContent = `${filtered.length} period(s)`;
        renderEntries();
    }

    function renderEntries() {
        const area = document.getElementById('tt-area');
        if (!area) return;
        if (viewMode === 'weekly') {
            renderWeekly(area);
        } else {
            renderList(area);
        }
    }

    function renderList(area) {
        area.innerHTML = filtered.length
          ? `<div class="table-wrap"><table>
                <thead><tr><th>Day</th><th>Period</th><th>Class</th><th>Subject</th><th>Teacher</th><th>Room</th></tr></thead>
                <tbody>${filtered.map(e => `<tr>
                    <td><strong>${escapeHtml(capitalize(e.dayOfWeek))}</strong></td>
                    <td>${escapeHtml(e.startTime)}–${escapeHtml(e.endTime)}</td>
                    <td>${escapeHtml(e.className)}</td>
                    <td>${escapeHtml(e.subjectName)}</td>
                    <td>${escapeHtml(e.teacherName)}</td>
                    <td>${escapeHtml(e.classroomName)}</td>
                </tr>`).join('')}</tbody>
            </table></div>`
          : `<div class="empty-state">No timetable entries match the current filter.</div>`;
    }

    function renderWeekly(area) {
        const slots = [...new Set(filtered.map(e => e.startTime + '|' + e.endTime + '|' + e.slotLabel))].sort();
        if (!slots.length) { area.innerHTML = `<div class="empty-state">No entries for weekly view.</div>`; return; }
        const header = `<tr><th>Period</th>${days.map(d => `<th>${capitalize(d)}</th>`).join('')}</tr>`;
        const body = slots.map(slot => {
            const [start, end, label] = slot.split('|');
            const cells = days.map(day => {
                const entry = filtered.find(e => e.dayOfWeek === day && e.startTime === start && e.endTime === end);
                return entry ? `<td><div class="period-card">
                    <strong>${escapeHtml(entry.subjectName)}</strong>
                    <span>${escapeHtml(entry.className)}</span>
                    <small>${escapeHtml(entry.teacherName)} · ${escapeHtml(entry.classroomName)}</small>
                </div></td>` : `<td></td>`;
            }).join('');
            return `<tr><td><strong>${escapeHtml(label || start)}</strong><br><small>${escapeHtml(start)}–${escapeHtml(end)}</small></td>${cells}</tr>`;
        }).join('');
        area.innerHTML = `<div class="table-wrap"><table class="weekly-grid"><thead>${header}</thead><tbody>${body}</tbody></table></div>`;
    }

    view.innerHTML = `
    <div class="page-heading">
        <div class="page-heading-text">
            <h1>📅 View Timetable</h1>
            <p>Browse the college timetable. Use filters to narrow by class or teacher.</p>
        </div>
        <div class="page-heading-actions">
            <button class="btn btn-secondary btn-sm" id="btn-csv">⬇ CSV</button>
            <button class="btn btn-secondary btn-sm" id="btn-pdf">⬇ PDF</button>
            <button class="btn btn-secondary btn-sm" id="btn-print">🖨 Print</button>
        </div>
    </div>
    <div class="panel">
        <div class="toolbar">
            <div class="toolbar-group">
                <input class="search-input" type="search" id="tt-search" placeholder="Search timetable…">
                <select class="filter-select" id="filter-class">
                    <option value="">All classes</option>
                    ${(classes || []).map(c => `<option value="${c.id}">${escapeHtml(c.name)}</option>`).join('')}
                </select>
                <select class="filter-select" id="filter-teacher">
                    <option value="">All teachers</option>
                    ${(teachers || []).map(t => `<option value="${t.id}">${escapeHtml(t.name)}</option>`).join('')}
                </select>
            </div>
            <div style="display:flex;gap:6px;align-items:center;">
                <span style="font-size:12px;color:#8fa5c5;" id="tt-count">${filtered.length} period(s)</span>
                <button class="btn btn-secondary btn-sm" id="btn-list-view">≡ List</button>
                <button class="btn btn-secondary btn-sm" id="btn-week-view">⊞ Weekly</button>
            </div>
        </div>
        <div id="tt-area"></div>
    </div>`;

    renderEntries();

    document.getElementById('tt-search').addEventListener('input', applyFilters);
    document.getElementById('filter-class').addEventListener('change', applyFilters);
    document.getElementById('filter-teacher').addEventListener('change', applyFilters);
    document.getElementById('btn-list-view').addEventListener('click', () => { viewMode = 'list'; renderEntries(); });
    document.getElementById('btn-week-view').addEventListener('click', () => { viewMode = 'weekly'; renderEntries(); });
    document.getElementById('btn-print').addEventListener('click', () => window.print());
    document.getElementById('btn-csv').addEventListener('click', () => exportCsv(filtered));
    document.getElementById('btn-pdf').addEventListener('click', () => exportPdf(filtered));
}

function exportCsv(entries) {
    const header = 'Day,Period,Start,End,Class,Subject,Teacher,Room';
    const rows   = entries.map(e => [e.dayOfWeek, e.slotLabel, e.startTime, e.endTime, e.className, e.subjectName, e.teacherName, e.classroomName].map(v => `"${String(v ?? '').replace(/"/g,'""')}"`).join(','));
    const blob   = new Blob([[header, ...rows].join('\n')], { type: 'text/csv' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'timetable.csv';
    a.click();
}

function exportPdf(entries) {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ orientation: 'landscape', format: 'a4' });
    doc.setFont('helvetica', 'bold'); doc.setFontSize(12);
    doc.text('CampusPlan — College Timetable', 14, 12);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(8);
    doc.text(`Generated: ${new Date().toLocaleString()}`, 297 - 14, 12, { align: 'right' });
    doc.autoTable({
        startY: 20,
        columns: ['Day','Period','Start','End','Class','Subject','Teacher','Room'].map((h,i) => ({header:h, dataKey:i})),
        body: entries.map(e => [capitalize(e.dayOfWeek||''),e.slotLabel||'',e.startTime||'',e.endTime||'',e.className||'',e.subjectName||'',e.teacherName||'',e.classroomName||'']),
        theme: 'grid',
        styles: { fontSize: 8, cellPadding: 3 },
        headStyles: { fillColor: [49, 94, 232], textColor: 255, fontStyle: 'bold' },
        alternateRowStyles: { fillColor: [246, 248, 252] },
        margin: { left: 14, right: 14 }
    });
    doc.save('timetable.pdf');
}

// ── Conflicts ────────────────────────────────────────────────────────────────
async function renderConflicts() {
    const response = await api('conflicts');
    const items = response.items || [];
    view.innerHTML = `
    <div class="page-heading">
        <div class="page-heading-text">
            <h1>⚑ Conflict Report</h1>
            <p>Review schedule overlaps, teacher availability, and weekly subject requirements.</p>
        </div>
    </div>
    <div class="panel">
        <div class="panel-head">
            <div>
                <h2>${items.length ? `⚠ ${items.length} issue(s) found` : '✅ No conflicts detected'}</h2>
                <p>${escapeHtml(response.message)}</p>
            </div>
            <span class="${items.length ? 'badge-error' : 'badge-ok'}">${items.length ? items.length + ' issues' : 'Clean'}</span>
        </div>
        ${items.length ? `<div class="table-wrap"><table>
            <thead><tr><th>Issue</th><th>Day / Time</th><th>Affected Schedule</th><th>Other Schedule</th><th>Suggestion</th></tr></thead>
            <tbody>${items.map(item => {
                const s1 = [item.firstClass, item.firstSubject, item.firstTeacher, item.firstClassroom].filter(Boolean).join(' · ');
                const s2 = [item.secondClass, item.secondSubject, item.secondTeacher, item.secondClassroom].filter(Boolean).join(' · ');
                return `<tr>
                    <td><span class="badge-error">${escapeHtml(item.type)}</span></td>
                    <td><strong>${escapeHtml(item.day)}</strong><br><small>${escapeHtml(item.time)}</small></td>
                    <td>${escapeHtml(s1 || '—')}</td>
                    <td>${escapeHtml(s2 || '—')}</td>
                    <td>${escapeHtml(item.suggestion)}</td>
                </tr>`;
            }).join('')}</tbody>
        </table></div>` : `<div class="empty-state">🎉 ${escapeHtml(response.message)}</div>`}
    </div>`;
}

// ── Init ─────────────────────────────────────────────────────────────────────
const initPage = window.location.hash.slice(1) || 'timetable';
navigate(pages[initPage] ? initPage : 'timetable');
</script>
